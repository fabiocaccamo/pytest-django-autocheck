name: Test package

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:

  prepare:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Combinations follow each Django release's official Python support
    # (keep in sync with tox.ini).
    - name: Create matrix
      uses: fabiocaccamo/create-matrix-action@c31a63f5bfe2ce1cc2a95d4adb6d45e880f5548f # v6
      id: create_matrix
      with:
        matrix: |
          os {ubuntu-latest, macos-latest, windows-latest}, python-version {3.10}, django-version {5.0, 5.1, 5.2}
          os {ubuntu-latest, macos-latest, windows-latest}, python-version {3.11}, django-version {5.0, 5.1, 5.2}
          os {ubuntu-latest, macos-latest, windows-latest}, python-version {3.12}, django-version {5.0, 5.1, 5.2, 6.0, 6.1}
          os {ubuntu-latest, macos-latest, windows-latest}, python-version {3.13}, django-version {5.1, 5.2, 6.0, 6.1}
          os {ubuntu-latest, macos-latest, windows-latest}, python-version {3.14}, django-version {6.0, 6.1}

    # Postgres runs in a separate ubuntu-only job: `services` containers
    # require a Linux runner, so they can't join the mixed-OS matrix above.
    - name: Create postgres matrix
      uses: fabiocaccamo/create-matrix-action@c31a63f5bfe2ce1cc2a95d4adb6d45e880f5548f # v6
      id: create_matrix_postgres
      with:
        matrix: |
          python-version {3.10}, django-version {5.0, 5.1, 5.2}
          python-version {3.11}, django-version {5.0, 5.1, 5.2}
          python-version {3.12}, django-version {5.0, 5.1, 5.2, 6.0, 6.1}
          python-version {3.13}, django-version {5.1, 5.2, 6.0, 6.1}
          python-version {3.14}, django-version {6.0, 6.1}

    outputs:
      matrix: ${{ steps.create_matrix.outputs.matrix }}
      matrix-postgres: ${{ steps.create_matrix_postgres.outputs.matrix }}

  lint:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14'
        cache: 'pip'

    - name: Run pre-commit
      run: |
        python -m pip install --upgrade pip pre-commit
        pre-commit run --all-files --show-diff-on-failure --verbose

  test:

    needs: [prepare]

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}

    runs-on: ${{ matrix.os }}

    steps:

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[test]"

    - name: Install Django ${{ matrix.django-version }}
      run: |
        python -m pip install "Django==${{ matrix.django-version }}.*"

    # The plugin is imported at pytest startup, before pytest-cov would begin
    # measuring, so `coverage run` is required to capture import-time lines.
    - name: Run tests
      shell: bash
      run: |
        coverage run -m pytest
        coverage report --show-missing
        coverage xml -o ./coverage.xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
        files: ./coverage.xml
        flags: unittests
        verbose: true

  test-postgres:

    needs: [prepare]

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix-postgres) }}

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[test]"

    - name: Install Django ${{ matrix.django-version }}
      run: |
        python -m pip install "Django==${{ matrix.django-version }}.*"

    - name: Run tests
      env:
        DATABASE_ENGINE: postgres
      run: |
        coverage run -m pytest
        coverage report --show-missing
        coverage xml -o ./coverage.xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
        files: ./coverage.xml
        flags: unittests
        verbose: true
