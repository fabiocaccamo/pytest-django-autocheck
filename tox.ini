[tox]
envlist =
    py310-django{50,51,52}
    py311-django{50,51,52}
    py312-django{50,51,52,60}
    py313-django{51,52,60}
    py314-django60

[testenv]
# Runtime + test dependencies come from pyproject.toml (single source of
# truth); only the Django version is overridden here for the matrix.
# Env combinations follow each Django release's official Python support.
extras = test
# Isolate each env's coverage data file so parallel runs (tox -p) don't
# clobber a shared .coverage and corrupt it.
setenv =
    COVERAGE_FILE = {envdir}/.coverage
deps =
    django50: Django>=5.0,<5.1
    django51: Django>=5.1,<5.2
    django52: Django>=5.2,<6.0
    django60: Django>=6.0,<6.1
commands =
    coverage run -m pytest {posargs}
    coverage report -m
